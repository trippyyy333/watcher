<body>
  <div class="container">
    <button class="back-button" onclick="history.back()">Back</button>
    <div id="show-details"></div>

    <div class="player-container">
      <iframe id="player-iframe" allowfullscreen scrolling="no"></iframe>
    </div>
    <button id="previous-episode-button" class="next-episode-button">Previous Episode</button>
    <button id="next-episode-button" class="next-episode-button">Next Episode</button>
    <div id="episodes-container" class="episodes-container"></div>
    <div class="torrent-buttons" id="torrent-buttons"></div>

  </div>

  <script>
    const API_KEY = "014ee686e7ce64cf0b540756cbc51640";
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get("id");
    const type = urlParams.get("type");
    const episodeNumber = urlParams.get("e") || 1; // Default to episode 1
    const seasonNumber = urlParams.get("season") || 1; // Default to season 1
    let currentImdbId = '';
    const episodesContainer = document.getElementById("episodes-container");
    

    


    async function fetchShowDetails() {
      try {
        const detailsResponse = await fetch(
          `https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US`
        );
        const showData = await detailsResponse.json();

        const externalIdsResponse = await fetch(
          `https://api.themoviedb.org/3/${type}/${id}/external_ids?api_key=${API_KEY}`
        );
        const externalIds = await externalIdsResponse.json();
        currentImdbId = externalIds.imdb_id;

        // Fetch cast information
        const creditsResponse = await fetch(
          `https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`
        );
        const creditsData = await creditsResponse.json();

        const showDetails = document.getElementById("show-details");
        
        // Create the background section with gradient overlay
        showDetails.innerHTML = `
          <section class="show-section" 
            style="background-image: linear-gradient(to top, 
              rgb(0, 0, 0), 
              rgba(0, 0, 0, 0.98), 
              rgba(0, 0, 0, 0.8), 
              rgba(0, 0, 0, 0.4)
            ), url('https://image.tmdb.org/t/p/original${showData.backdrop_path}')">
            <div class="show-container">
              <div class="poster-container">
                <img class="show-poster" 
                     src="https://image.tmdb.org/t/p/w500${showData.poster_path}" 
                     alt="${showData.title || showData.name}">
              </div>
              <div class="show-info">
                <h1>${showData.title || showData.name}</h1>
                <div class="genres">
                  ${showData.genres.map(genre => `
                    <span class="genre">${genre.name}</span>
                  `).join('')}
                  <button class="watch-now-button" id="watch-now">Watch Now</button>
                </div>
                <p class="overview">${showData.overview}</p>
                <div class="cast-grid">
                  ${creditsData.cast.slice(0, 5).map((actor, index) => `
                    <figure class="cast-card" style="animation-delay: ${index * 0.1}s">
                      <div class="cast-image-container">
                        <img 
                          src="${actor.profile_path 
                            ? `https://image.tmdb.org/t/p/w185${actor.profile_path}`
                            : 'https://via.placeholder.com/185x278?text=No+Image'}"
                          alt="${actor.name}"
                          class="cast-image">
                      </div>
                      <h4 class="cast-name">${actor.name}</h4>
                    </figure>
                  `).join('')}
                </div>
              </div>
            </div>
          </section>
        `;

        // Add back button functionality
        const backButton = document.querySelector('.back-button');
        backButton.addEventListener('click', (e) => {
          e.preventDefault();
          window.location.href = '/watcher/index.html';
        });

        // Set up initial player state
        const playerContainer = document.querySelector('.player-container');
        const iframe = document.getElementById('player-iframe');
        const episodesContainer = document.getElementById('episodes-container');

        if (type === 'movie') {
          // For movies: Show thumbnail initially
          iframe.src = `https://image.tmdb.org/t/p/original${showData.backdrop_path}`;
          iframe.style.pointerEvents = 'none'; // Prevent interaction with thumbnail
          
          // Hide episodes container and navigation buttons for movies
          episodesContainer.style.display = 'none';
          document.getElementById('previous-episode-button').style.display = 'none';
          document.getElementById('next-episode-button').style.display = 'none';
        } else {
          // For TV shows: Start with first episode
          iframe.src = `https://vidbinge.dev/embed/tv/${currentImdbId}/${seasonNumber}/${episodeNumber}`;
        }

        // Add watch button functionality
        const watchButton = document.getElementById('watch-now');
        watchButton.addEventListener('click', () => {
          // Scroll to player
          playerContainer.scrollIntoView({ behavior: 'smooth' });
          
          // Update video source and enable interaction
          if (type === 'movie') {
            iframe.src = `https://vidsrc.xyz/embed/movie/${currentImdbId}`;
            iframe.style.pointerEvents = 'auto';
          } else {
            iframe.src = `https://vidsrc.xyz/embed/tv/${currentImdbId}/${seasonNumber}-${episodeNumber}`;
          }
        });

        // Set up episode navigation for TV shows
        if (type === 'tv') {
          const prevButton = document.getElementById('previous-episode-button');
          const nextButton = document.getElementById('next-episode-button');
          
          // Get total episodes for current season
          const seasonResponse = await fetch(
            `https://api.themoviedb.org/3/tv/${id}/season/${seasonNumber}?api_key=${API_KEY}`
          );
          const seasonData = await seasonResponse.json();
          const totalEpisodes = seasonData.episodes.length;

          // Update episode function
          async function updateEpisode(season, episode) {
            const iframe = document.getElementById('player-iframe');
            
            // Update URL parameters
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('season', season);
            newUrl.searchParams.set('e', episode);
            window.history.pushState({ season, episode }, '', newUrl);

            // Update iframe source
            iframe.src = `https://vidsrc.xyz/embed/tv/${currentImdbId}/${season}-${episode}`;
            // iframe.src = `https://vidbinge.dev/embed/tv/${currentImdbId}/${season}/${episode}`;

            // Update active episode in UI
            document.querySelectorAll('.episode-button').forEach(button => {
              button.classList.remove('active');
            });
            
            const activeEpisode = document.querySelector(
              `.episode-button[data-season="${season}"][data-episode="${episode}"]`
            );
            if (activeEpisode) {
              activeEpisode.classList.add('active');
              activeEpisode.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Update global variables to match URL
            seasonNumber = season;
            episodeNumber = episode;
          }

          // Previous Episode Button
          prevButton.addEventListener('click', async () => {
            // Get current episode and season from URL
            const urlParams = new URLSearchParams(window.location.search);
            let currentEpisode = parseInt(urlParams.get('e')) || 1;
            let currentSeason = parseInt(urlParams.get('season')) || 1;

            try {
              // Get current season's episode count
              const currentSeasonResponse = await fetch(
                `https://api.themoviedb.org/3/tv/${id}/season/${currentSeason}?api_key=${API_KEY}`
              );
              const currentSeasonData = await currentSeasonResponse.json();

              if (currentEpisode > 1) {
                // Simply decrement episode if not first episode
                currentEpisode--;
                await updateEpisode(currentSeason, currentEpisode);
              } else if (currentSeason > 1) {
                // Get previous season's episode count
                const prevSeasonResponse = await fetch(
                  `https://api.themoviedb.org/3/tv/${id}/season/${currentSeason - 1}?api_key=${API_KEY}`
                );
                const prevSeasonData = await prevSeasonResponse.json();
                
                // Move to last episode of previous season
                currentSeason--;
                currentEpisode = prevSeasonData.episodes.length;
                await updateEpisode(currentSeason, currentEpisode);
              }

              // Update URL parameters immediately
              const newUrl = new URL(window.location.href);
              newUrl.searchParams.set('season', currentSeason);
              newUrl.searchParams.set('e', currentEpisode);
              window.history.pushState({ season: currentSeason, episode: currentEpisode }, '', newUrl);

            } catch (error) {
              console.error("Error updating episode:", error);
            }
          });

          // Next Episode Button
          nextButton.addEventListener('click', async () => {
            // Get current episode and season from URL
            const urlParams = new URLSearchParams(window.location.search);
            let currentEpisode = parseInt(urlParams.get('e')) || 1;
            let currentSeason = parseInt(urlParams.get('season')) || 1;

            // Get total episodes for current season
            try {
              const response = await fetch(
                `https://api.themoviedb.org/3/tv/${id}/season/${currentSeason}?api_key=${API_KEY}`
              );
              const seasonData = await response.json();
              const totalEpisodes = seasonData.episodes.length;

              if (currentEpisode < totalEpisodes) {
                // Increment episode if not last episode
                currentEpisode++;
                await updateEpisode(currentSeason, currentEpisode);
              } else {
                // Move to next season's first episode
                const showResponse = await fetch(
                  `https://api.themoviedb.org/3/tv/${id}?api_key=${API_KEY}`
                );
                const showData = await showResponse.json();
                
                if (currentSeason < showData.number_of_seasons) {
                  currentSeason++;
                  currentEpisode = 1;
                  await updateEpisode(currentSeason, currentEpisode);
                }
              }
            } catch (error) {
              console.error("Error updating episode:", error);
            }
          });
        }

        // Call fetchShowDetails when the page loads
        window.addEventListener('load', fetchShowDetails);

        // Set up episode navigation
        if (type === 'tv') {
          const prevButton = document.getElementById('previous-episode-button');
          const nextButton = document.getElementById('next-episode-button');
          
          // Get total episodes for current season
          const seasonResponse = await fetch(
            `https://api.themoviedb.org/3/tv/${id}/season/${seasonNumber}?api_key=${API_KEY}`
          );
          const seasonData = await seasonResponse.json();
          const totalEpisodes = seasonData.episodes.length;

          // Previous Episode Button
          prevButton.addEventListener('click', () => {
            let newEpisode = parseInt(episodeNumber);
            let newSeason = parseInt(seasonNumber);

            if (newEpisode > 1) {
              newEpisode--;
            } else if (newSeason > 1) {
              newSeason--;
              // Get episode count for previous season
              fetch(`https://api.themoviedb.org/3/tv/${id}/season/${newSeason}?api_key=${API_KEY}`)
                .then(res => res.json())
                .then(data => {
                  newEpisode = data.episodes.length;
                  updateEpisode(newSeason, newEpisode);
                });
              return;
            }
            updateEpisode(newSeason, newEpisode);
          });

          // Next Episode Button
          nextButton.addEventListener('click', () => {
            let newEpisode = parseInt(episodeNumber);
            let newSeason = parseInt(seasonNumber);

            if (newEpisode < totalEpisodes) {
              newEpisode++;
            } else if (newSeason < showData.number_of_seasons) {
              newSeason++;
              newEpisode = 1;
            }
            updateEpisode(newSeason, newEpisode);
          });

          // Update episode function
          function updateEpisode(season, episode) {
            // Update URL parameters
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('season', season);
            newUrl.searchParams.set('e', episode);
            window.history.pushState({}, '', newUrl);

            // Update iframe source
            iframe.src = `https://vidsrc.xyz/embed/tv/${currentImdbId}/${season}-${episode}`;
                // iframe.src = `https://vidbinge.dev/embed/tv/${currentImdbId}/${season.season_number}/${episode.episode_number}`;

            // Update active episode in UI
            document.querySelectorAll('.episode-button').forEach(button => {
              button.classList.remove('active');
            });
            const activeEpisode = document.querySelector(
              `.episode-button[data-season="${season}"][data-episode="${episode}"]`
            );
            if (activeEpisode) {
              activeEpisode.classList.add('active');
              activeEpisode.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Update global variables
            seasonNumber = season;
            episodeNumber = episode;
          }

          // Hide navigation buttons for movies
        } else {
          document.getElementById('previous-episode-button').style.display = 'none';
          document.getElementById('next-episode-button').style.display = 'none';
        }
        
          // Display episodes for TV shows
          for (const season of showData.seasons) {
            if (season.season_number === 0) continue; // Skip season 0 (usually specials)

            const seasonDiv = document.createElement('div');
            seasonDiv.innerHTML = `
              <div class="season-title" onclick="toggleSeason(${season.season_number})">
                <span>Season ${season.season_number}</span>
                <span>▼</span>
              </div>
              <div class="episodes-grid" id="season-${season.season_number}-episodes"></div>
            `;
            episodesContainer.appendChild(seasonDiv);

            const episodesGrid = seasonDiv.querySelector('.episodes-grid');
            const seasonResponse = await fetch(
              `https://api.themoviedb.org/3/tv/${id}/season/${season.season_number}?api_key=${API_KEY}&language=en-US`
            );
            const seasonData = await seasonResponse.json();

            seasonData.episodes.forEach(episode => {
              const button = document.createElement('button');
              button.className = 'episode-button';
              button.textContent = `EP${episode.episode_number} - ${episode.name}`;
              button.onclick = () => {
                markAsWatched(season.season_number, episode.episode_number);
                // Update URL with new episode number
                const newUrl = new URL(window.location.href);
                newUrl.searchParams.set('season', season.season_number);
                newUrl.searchParams.set('e', episode.episode_number);
                window.history.pushState({}, '', newUrl);
                // Update iframe source
                iframe.src = `https://vidsrc.xyz/embed/tv/${currentImdbId}/${season.season_number}-${episode.episode_number}`;
                // iframe.src = `https://vidbinge.dev/embed/tv/${currentImdbId}/${season.season_number}/${episode.episode_number}`;
              };

              if (isWatched(season.season_number, episode.episode_number)) {
                button.classList.add('watched');
              }

              // Add active class to current episode
              if (season.season_number === parseInt(seasonNumber) && 
                  episode.episode_number === parseInt(episodeNumber)) {
                button.classList.add('active');
              }

              episodesGrid.appendChild(button);
            });
          }

          // Set initial iframe source for TV shows
          iframe.src = `https://vidsrc.xyz/embed/tv/${currentImdbId}/${seasonNumber}-${episodeNumber}`;
          // iframe.src = `https://vidbinge.dev/embed/tv/${currentImdbId}/${seasonNumber}/${episodeNumber}`;
        


      } catch (error) {
        console.error("Error fetching details:", error);
      }
    }
    

    function toggleSeason(seasonNumber) {
      const episodesGrid = document.getElementById(`season-${seasonNumber}-episodes`);
      episodesGrid.style.display = episodesGrid.style.display === 'flex' ? 'none' : 'flex';
    }

    function markAsWatched(season, episode) {
      const key = `watched-${season}-${episode}`;
      localStorage.setItem(key, true);
      document.querySelectorAll('.episode-button').forEach(button => button.classList.remove('active'));
    }

    function isWatched(season, episode) {
      const key = `watched-${season}-${episode}`;
      return localStorage.getItem(key) !== null;
    }

    function initializePlayer() {
      const iframe = document.getElementById('player-iframe');
      const player = new PlayerAPI(iframe); // Replace with actual player API initialization

      player.on('ready', () => {
        setInterval(() => {
          const currentTime = player.getCurrentTime(); // Replace with actual method
          const duration = player.getDuration(); // Replace with actual method

          const formatTime = (time) => {
            const minutes = Math.floor(time / 60);
            const seconds = Math.floor(time % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
          };

          const timer = document.getElementById('timer');
          timer.textContent = `Time: ${formatTime(currentTime)} / ${formatTime(duration)}`;
        }, 1000);
      });
    }

    fetchShowDetails();
    initializePlayer(); // Call this function to set up the player
  </script>
</body>
